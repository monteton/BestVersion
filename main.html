<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная — Фитнес</title>
    <style>
        body {
            background: #faf9f6;
            color: #222;
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 12px 12px 90px 12px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin: 0 0 16px 0;
            font-size: 1.3em;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin: 0 auto 16px auto;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(44,62,80,0.13);
        }
        .card-preview {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px 12px 0 0;
            position: relative;
        }
        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-caption {
            padding: 8px;
            font-size: 0.9em;
            color: #222;
            text-align: center;
            background: #faf9f6;
            border-radius: 0 0 12px 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }
        /* Нижнее меню */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 66px;
            z-index: 100;
            border-radius: 18px 18px 0 0;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 0.93em;
            gap: 2px;
            transition: color 0.2s;
            padding: 6px 0;
            min-width: 54px;
            max-width: 80px;
            overflow: hidden;
            white-space: nowrap;
        }
        .nav-item.active, .nav-item:active {
            color: #222;
        }
        .nav-icon {
            font-size: 1.34em;
            line-height: 1;
        }
        .nav-label {
            font-size: 0.91em;
            line-height: 1.1;
        }
        </style>
        </head>
        <body>
            <div class="container">
                <h1>Главная</h1>
                <div class="grid">
                    <!-- 1. Еженедельные тренировки -->
                    <a href="trainings.html" class="card">
                        <div class="card-preview">
                            <img src="images/placeholder1.jpg" alt="Еженедельные тренировки">
                        </div>
                        <div class="card-caption">Еженедельные тренировки</div>
                    </a>
                    <!-- 2. Тренировки для зала -->
                    <a href="trainings-gym.html" class="card">
                        <div class="card-preview">
                            <img src="images/placeholder2.jpg" alt="Тренировки для зала">
                        </div>
                        <div class="card-caption">Тренировки для зала</div>
                    </a>
                    <!-- 3. Питание -->
                    <a href="food.html" class="card">
                        <div class="card-preview">
                            <img src="images/placeholder3.jpg" alt="Питание">
                        </div>
                        <div class="card-caption">Питание</div>
                    </a>
            </a>
            <!-- 4. Растяжка -->
            <a href="razminka.html" class="card">
                <div class="card-preview">
                    <img src="images/placeholder4.jpg" alt="Растяжка">
                </div>
                <div class="card-caption">Растяжка</div>
            </a>
            <!-- 5. Калькулятор калорий -->
            <a href="https://calorazh.ru" target="_blank" class="card">
                <div class="card-preview">
                    <img src="images/placeholder5.jpg" alt="Калькулятор калорий">
                </div>
                <div class="card-caption">Калькулятор калорий</div>
            </a>
            <!-- 6. Уход за собой -->
            <a href="selfcare.html" class="card">
                <div class="card-preview">
                    <img src="images/placeholder6.jpg" alt="Уход за собой">
                </div>
                <div class="card-caption">Уход за собой</div>
            </a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">&#8962;</span>
            <span class="nav-label">Главная</span>
        </a>
        <a href="trainings.html" class="nav-item">
            <span class="nav-icon">&#128170;</span>
            <span class="nav-label">Тренировки</span>
        </a>
        <a href="food.html" class="nav-item">
            <span class="nav-icon">&#127828;</span>
            <span class="nav-label">Питание</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">&#128100;</span>
            <span class="nav-label">Профиль</span>
        </a>
    </nav>
</body>
</html>
