<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Просмотр PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-bg': '#cfc7b8',
                        'dark-charcoal': '#232220',
                    },
                },
            },
        }
    </script>
    <style>
        /* Ensure html and body allow scrolling in all directions after zoom */
        html,
        body {
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y pinch-zoom;
            overscroll-behavior: auto;
            width: 100%;
            min-height: 100vh;
        }

        #pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-bottom: 100px;
            touch-action: pan-x pan-y pinch-zoom;
        }

        canvas {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 8px;
            max-width: 100%;
            touch-action: pan-x pan-y pinch-zoom;
        }

        /* Make sure the fixed header doesn't block scroll/pan touch events */
        .header-bar {
            pointer-events: none;
        }

        .header-bar>* {
            pointer-events: auto;
        }

        /* Zoom controls */
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 16px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .zoom-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #232220;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.15s, background 0.15s;
        }

        .zoom-btn:active {
            transform: scale(0.92);
            background: rgba(240, 238, 234, 0.95);
        }
    </style>
</head>

<body class="bg-app-bg min-h-screen">

    <!-- Шапка с кнопкой назад -->
    <div
        class="header-bar fixed top-0 left-0 right-0 bg-white/90 backdrop-blur-sm shadow-sm z-50 px-4 py-3 flex items-center justify-between">
        <a href="./bonus.html" class="flex items-center gap-2 text-dark-charcoal font-bold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Назад
        </a>
        <span class="font-semibold text-sm">Меню питания</span>
        <div class="w-16"></div> <!-- Spacer for centering -->
    </div>

    <div id="pdf-container" class="pt-20 px-4">
        <div id="loading" class="text-center mt-10 text-dark-charcoal font-medium animate-pulse">
            Загрузка документа...
        </div>
    </div>

    <!-- Zoom controls for easy zoom without pinch -->
    <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in" aria-label="Увеличить">+</button>
        <button class="zoom-btn" id="zoom-out" aria-label="Уменьшить">−</button>
        <button class="zoom-btn" id="zoom-reset" aria-label="Сбросить" style="font-size:14px;">1:1</button>
    </div>

    <script>
        // Инициализация PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const url = './menupitaniya.pdf';
        const container = document.getElementById('pdf-container');
        const loading = document.getElementById('loading');

        let currentDisplayScale = 1; // CSS scale multiplier for the canvases
        const canvases = [];

        async function renderPDF() {
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;

                loading.style.display = 'none';

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);

                    // Рендерим в высоком качестве (масштаб 3)
                    const scale = 3;
                    const viewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');

                    // Устанавливаем реальные размеры canvas (высокое разрешение)
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    // Стили для адаптивности (canvas будет занимать 100% ширины контейнера)
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    container.appendChild(canvas);
                    canvases.push(canvas);
                    await page.render(renderContext).promise;
                }
            } catch (error) {
                console.error('Error rendering PDF:', error);
                loading.textContent = 'Ошибка при загрузке PDF. Попробуйте обновить страницу.';
                loading.classList.remove('animate-pulse');
                loading.classList.add('text-red-600');
            }
        }

        // Zoom controls
        function applyZoom(newScale) {
            currentDisplayScale = Math.max(0.5, Math.min(3, newScale));
            canvases.forEach(c => {
                c.style.width = (100 * currentDisplayScale) + '%';
                c.style.maxWidth = 'none';
            });
            // Allow horizontal scroll when zoomed in
            if (currentDisplayScale > 1) {
                container.style.alignItems = 'flex-start';
            } else {
                container.style.alignItems = 'center';
            }
        }

        document.getElementById('zoom-in').addEventListener('click', () => {
            applyZoom(currentDisplayScale + 0.25);
        });
        document.getElementById('zoom-out').addEventListener('click', () => {
            applyZoom(currentDisplayScale - 0.25);
        });
        document.getElementById('zoom-reset').addEventListener('click', () => {
            applyZoom(1);
        });

        renderPDF();
    </script>
</body>

</html>
